# ===============================
# APPLICATION
# ===============================
spring.application.name=Backend-sg
server.port=${PORT:8099}
server.forward-headers-strategy=framework

# ===============================
# MONGODB
# ===============================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=products_db

# ===============================
# JWT (optional legacy support)
# ===============================
jwt.secret=${JWT_SECRET:local-dev-only-change-me-in-production-32chars}
jwt.access.expiry=900000
jwt.refresh.expiry=604800000

# ===============================
# FRONTEND (password reset links, CORS helper)
# ===============================
frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://machine-mechanics-frontend.vercel.app}

# ===============================
# COOKIE / SESSION (cross-origin SPA: SameSite=None + Secure on HTTPS)
# ===============================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_SAME_SITE:none}
server.servlet.session.timeout=30m

# ===============================
# BREVO
# ===============================
brevo.api.key=${BREVO_API_KEY:}

# ===============================
# MULTIPART
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# IMAGEKIT
# ===============================
product.imagekit.publicKey=${IMAGEKIT_PUBLIC_KEY:}
product.imagekit.privateKey=${IMAGEKIT_PRIVATE_KEY:}
product.imagekit.urlEndpoint=${IMAGEKIT_URL_ENDPOINT:}

career.imagekit.publicKey=${CAREER_IMAGEKIT_PUBLIC_KEY:${IMAGEKIT_PUBLIC_KEY:}}
career.imagekit.privateKey=${CAREER_IMAGEKIT_PRIVATE_KEY:${IMAGEKIT_PRIVATE_KEY:}}
career.imagekit.urlEndpoint=${CAREER_IMAGEKIT_URL_ENDPOINT:${IMAGEKIT_URL_ENDPOINT:}}
